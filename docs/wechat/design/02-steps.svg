<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style><rect width="100%" height="100%" fill="#09141f"/><text x="500" y="72" font-size="40" fill="#f1f7fb" text-anchor="middle">让第一次加网，有明确的下一步</text><text x="500" y="118" font-size="24" fill="#b0c7d5" text-anchor="middle">P2P VPN · 从网页引导到设备加入</text><rect x="40" y="170" width="280" height="275" rx="20" fill="#102737" stroke="#294455" stroke-width="2"/><circle cx="180" cy="226" r="27" fill="#92dfe8"/><text x="180" y="236" font-size="28" fill="#09141f" text-anchor="middle">1</text><text x="180" y="303" font-size="29" fill="#f1f7fb" text-anchor="middle">注册与验证邮箱</text><text x="180" y="358" font-size="22" fill="#b0c7d5" text-anchor="middle">登录自己的控制台</text><text x="180" y="399" font-size="20" fill="#b0c7d5" text-anchor="middle">按引导开始创建网络</text><rect x="360" y="170" width="280" height="275" rx="20" fill="#102737" stroke="#294455" stroke-width="2"/><circle cx="500" cy="226" r="27" fill="#92dfe8"/><text x="500" y="236" font-size="28" fill="#09141f" text-anchor="middle">2</text><text x="500" y="303" font-size="29" fill="#f1f7fb" text-anchor="middle">创建网络与分组</text><text x="500" y="358" font-size="22" fill="#b0c7d5" text-anchor="middle">设置私有网段</text><text x="500" y="399" font-size="20" fill="#b0c7d5" text-anchor="middle">需要互通的设备放在同组</text><rect x="680" y="170" width="280" height="275" rx="20" fill="#102737" stroke="#294455" stroke-width="2"/><circle cx="820" cy="226" r="27" fill="#92dfe8"/><text x="820" y="236" font-size="28" fill="#09141f" text-anchor="middle">3</text><text x="820" y="303" font-size="29" fill="#f1f7fb" text-anchor="middle">复制命令加设备</text><text x="820" y="358" font-size="22" fill="#b0c7d5" text-anchor="middle">每台设备单独生成命令</text><text x="820" y="399" font-size="20" fill="#b0c7d5" text-anchor="middle">执行后检查真实在线状态</text><text x="340" y="304" font-size="34" fill="#92dfe8" text-anchor="middle">›</text><text x="660" y="304" font-size="34" fill="#92dfe8" text-anchor="middle">›</text><text x="500" y="512" font-size="24" fill="#92dfe8" text-anchor="middle">一条命令对应一台设备；领取配置成功 ≠ 已经在线</text></svg>